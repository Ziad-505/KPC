<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>This form doesn't exist</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <!-- Illustration -->
        <div class="illustration">
            <img src="bird.png" alt="Form unavailable">
        </div>

        <!-- Main message -->
        <section class="message">
            <h1>This form doesn't exist</h1>

            <p>
                Please make sure the link is correct and try again.
            </p>

            <!-- Technical details -->
            <button class="technical-toggle" id="technicalToggle">
                <span class="arrow" id="arrow"></span>
                <span>Technical details</span>
            </button>

            <div class="technical-details" id="technicalDetails">
                <p>
                    The form you're trying to access may have been deleted,
                    moved, or the link may be incorrect.
                </p>
            </div>
        </section>

        <!-- Create form button -->
        <div class="create-form">
            <button id="createButton">
                Create my own form
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="footer">

        <div class="footer-links">
            <span>Microsoft Forms</span>

            <a href="#">Privacy and cookies</a>

            <span class="separator">|</span>

            <a href="#">Consumer Health Privacy</a>

            <span class="separator">|</span>

            <a href="#">Terms of use</a>
        </div>

        <div class="microsoft-brand">
            <img src="microsoft365logo_v1.png" alt="Microsoft 365">
        </div>

    </footer>

    <script src="script.js"></script>

</body>
</html>
